theme: jekyll-theme-chirpy

lang: en
timezone: America/Los_Angeles

title: Matt's Skills
tagline: Skills for Codex & Claude Code
description: Portable skills for PR review, code images, and project handoffs, packaged for Codex and Claude Code.

url: "https://mttmcknn.github.io"
baseurl: "/skills"

github:
  username: mttmcknn

# Sidebar profile
avatar: "https://github.com/mttmcknn.png"

social:
  name: Matt McKenna
  links:
    - https://github.com/mttmcknn
    - https://bsky.app/profile/mmckenna.me
    - https://androiddev.social/@mattm
    - https://www.threads.net/@himattm
    - https://www.linkedin.com/in/himattm

# Theme + UX
# theme_mode: leave empty so Chirpy respects the user's system preference
# (prefers-color-scheme). Set to `light` or `dark` to force one mode.
theme_mode:
toc: true                # show TOC on post pages
paginate: 10

# Disable HTML compression. Chirpy's refactor-content strips the <pre> wrapper
# from highlighted code, then jekyll-compress-html collapses internal whitespace
# in the unwrapped <code>, eating newlines in multi-line code blocks. Skipping
# compression keeps the newlines and only costs ~15% HTML size.
compress_html:
  ignore:
    envs: all

# Make _tabs/ a Jekyll collection so Chirpy renders the sidebar nav.
# (Theme defines this in its own _config; we re-declare since site config
# overrides theme config wholesale, not by merge.)
collections:
  tabs:
    output: true
    sort_by: order

# Skills are rendered as Chirpy posts; the transform script in bin/build-posts.rb
# generates _posts/ from plugins/<plugin>/skills/<skill>/SKILL.md before each build.
# Per-post `permalink:` is set by the script so URLs mirror the source structure.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      hidden: false
  - scope:
      path: _tabs
      type: tabs
    values:
      layout: page
      permalink: /:title/

plugins:
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-include-cache

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

exclude:
  - Gemfile
  - Gemfile.lock
  - bin/
  - README.md
  - .codex/
  - .claude/
  - docs/
  - .claude-plugin/
  - .agents/
  - plugins/
  - tests/
  - AGENTS.md
  - android/
  - review/
  - utilities/
  - maintenance/
  - scripts/
  - requirements-dev.txt
